version: '3.8'

services:
  assistia-api:
    build: .
    container_name: assistia-api
    ports:
      - "8003:8003"
    volumes:
      - ./dados:/app/dados
      - ./api:/app/api
      - ./embeddings_cache.pkl:/app/embeddings_cache.pkl
      - ollama_data:/root/.ollama  # Persistir modelos baixados
    environment:
      - PYTHONPATH=/app
      - OLLAMA_HOST=http://localhost:11434
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=2
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  ollama_data:
    driver: local