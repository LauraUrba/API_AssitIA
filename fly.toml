app = "assistia-api-tcc"
primary_region = "gru"
kill_signal = "SIGINT"

[build]
  dockerfile = "Dockerfile"

[env]
  OLLAMA_HOST = "http://localhost:11434"
  OLLAMA_KEEP_ALIVE = "24h"
  # Reduzido de "2" para "1": a arquitetura atual gera uma atividade por vez
  # (uma chamada ao modelo por área), em sequência — não em paralelo. Manter
  # 2 slots reservados só disputava CPU com a própria geração em andamento,
  # sem nenhum ganho real. Isso é de graça, sem custo extra no Fly.
  OLLAMA_NUM_PARALLEL = "1"
  PYTHONPATH = "/app"

[http_service]
  internal_port = 8003
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "4gb"
  cpu_kind = "shared"
  cpus = 2

[[mounts]]
  source = "ollama_data"
  destination = "/root/.ollama"

